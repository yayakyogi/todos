server {
    listen 80;
    root /usr/share/nginx/html;

    # Forward /api/... to the API container; the trailing slash strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so browsers may cache them forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry point must always be revalidated to pick up new deploys.
    location = /200.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any URL that is not a real file is handled by the client router.
    location / {
        try_files $uri /200.html;
    }
}
