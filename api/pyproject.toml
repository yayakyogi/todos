[project]
name = "todo-api"
version = "0.1.0"
description = "Todo API"
authors = [
    {name = "yogi",email = "yayaktaka@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "sqlmodel (>=0.0.48,<0.0.49)",
    "psycopg[binary] (>=3.3.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]

[tool.poetry]
package-mode = false
